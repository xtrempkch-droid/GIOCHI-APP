# Snapshot da engine, copiado do workspace GIOCHI-ENGINE-3D no commit cd94ce6
# (engine 0.3.1).
#
# O jogo não compila contra o repositório compartilhado: uma mudança da equipe da
# engine não pode quebrar este jogo sem alguém atualizar a cópia de propósito.
# Mesma decisão do `cobrinha` e do `neon-drift` (§25 do AGENTS.md) — e é o que
# torna a regra R1 ("o jogo consome a engine, não a modifica") verificável: aqui
# dentro nada é editado, com as duas exceções de manifesto declaradas abaixo.
#
# Atualizar = copiar de novo:
#   git -C ../../../../../GIOCHI-ENGINE-3D archive <commit> giochi-engine giochi-engine-3d \
#     | tar -x -C vendor
#
# ## Uma correção de manifesto, e uma que deixou de ser necessária
#
# **Resolvido pela engine em `cd94ce6` (0.3.1):** o `giochi-engine-3d` declarava
# `giochi-engine` sem `default-features = false`, e a unificação de features
# ligava o `sdl2-bundled` mesmo com o jogo pedindo `sdl2-system` — o build caía no
# cmake ignorando o pkg-config. Aquele snapshot carregava esta correção à mão.
# Agora ela **vem do repositório**: o `giochi-engine-3d` encaminha os dois
# features do SDL2 explicitamente e o `default` dele é `sdl2-bundled`. As linhas
# abaixo não são mais remenda; conferir com
#   git -C ../../../../../GIOCHI-ENGINE-3D archive cd94ce6 giochi-engine giochi-engine-3d \
#     | tar -x -C /tmp/v && diff -rq /tmp/v .
#
# **Continua sendo escolha desta cópia:** `[workspace.dependencies]` abaixo é a
# cópia **fiel** do manifesto real,
#    incluindo `features = ["image", "mixer", "ttf", "unsafe_textures"]` no
#    `sdl2`. Sem essas quatro a engine 2D não compila (`unsafe_textures` é o que
#    dispensa o tempo de vida da `Texture`, ADR-017; `image` é o que traz
#    `load_texture_bytes`).
[workspace]
resolver = "2"
members = ["giochi-engine", "giochi-engine-3d"]

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["GIOCHI-SYSTEM contributors"]
repository = "https://github.com/xtrempkch-droid/GIOCHI-SYSTEM"

[workspace.dependencies]
sdl2 = { version = "0.38", default-features = false, features = ["image", "mixer", "ttf", "unsafe_textures"] }
glam = "0.29"
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
mlua = { version = "0.12", features = ["lua54", "vendored"] }
cbindgen = "0.27"
criterion = { version = "0.5", features = ["html_reports"] }
glow = "0.14"
bytemuck = { version = "1", features = ["derive"] }
tobj = "4"
