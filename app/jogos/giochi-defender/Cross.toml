# Cross-compilação com `cross` (https://github.com/cross-rs/cross).
#
# Este jogo usa `sdl2-system` por padrão: no aparelho o SDL2 vem da imagem
# (Buildroot, com KMSDRM) e compilar uma segunda cópia no rootfs não faz sentido.
# Num contêiner de CI não há essa imagem, então o `pre-build` instala os
# satellites do SDL2 para aarch64 — é o que o `sdl2-sys` procura no `pkg-config`
# quando `use-pkgconfig` está ligado.
#
# No dia a dia deste repositório o caminho é outro e já está provado:
#   bash scripts/compilar-jogo-arm64.sh --jogo giochi-defender
# Ele usa o sysroot extraído do próprio aparelho (`~/.cache/giochi-arm64`) e o
# wrapper de link que resolve as cinco armadilhas do aarch64. Este arquivo existe
# para o caminho reprodutível em CI, que não depende de um aparelho na bancada.
[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:0.2.5"
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update",
    # Backends de áudio/entrada do SDL2 (libasound pelo mixer, libudev pelos
    # controles) e os quatro satellites que o manifesto da engine exige.
    "apt-get install -y --no-install-recommends libasound2-dev:arm64 libudev-dev:arm64",
    "apt-get install -y --no-install-recommends libsdl2-dev:arm64 libsdl2-image-dev:arm64 libsdl2-mixer-dev:arm64 libsdl2-ttf-dev:arm64",
]
