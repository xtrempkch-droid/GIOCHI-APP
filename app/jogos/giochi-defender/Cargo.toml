[package]
name = "giochi-defender"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "Proprietary"
description = "Tower defense espacial 3D low-poly que roda sobre a GIOCHI-ENGINE"

# `exclude` e não `members`: o snapshot em `vendor/` é um workspace próprio, com
# as suas próprias versões. O jogo o consome por caminho, como o neon-drift faz.
[workspace]
resolver = "2"
exclude = ["vendor"]

[dependencies]
# O snapshot local, nunca o repositório compartilhado — ver `vendor/Cargo.toml`.
giochi-engine = { path = "vendor/giochi-engine", default-features = false }
giochi-engine-3d = { path = "vendor/giochi-engine-3d", default-features = false }
# Acesso direto ao SDL2 para o modo de mouse relativo, que a fachada da engine
# não expõe (`Platform::sdl_mouse` devolve o `MouseUtil` justamente para isto).
sdl2 = { version = "0.38", default-features = false }
glam = "0.29"
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"

[features]
# O aparelho entrega o SDL2 pela imagem (Buildroot, com KMSDRM); compilar do
# código-fonte exigiria cmake e uma segunda cópia no rootfs. É o padrão porque é
# o alvo de produção e o que a bancada de desenvolvimento usa.
default = ["sdl2-system"]
sdl2-system = ["giochi-engine/sdl2-system", "giochi-engine-3d/sdl2-system"]
sdl2-bundled = ["giochi-engine/sdl2-bundled", "giochi-engine-3d/sdl2-bundled"]
# Fase 15 da engine: contadores de draw call no renderer 3D.
profiling = ["giochi-engine/profiling", "giochi-engine-3d/profiling"]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[[bench]]
name = "frame_time"
harness = false
