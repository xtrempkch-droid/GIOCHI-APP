[package]
name = "giochi-cobrinha"
description = "Cobrinha 3D — GIOCHI-ENGINE 3D sobre GLES/EGL"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "giochi-cobrinha"
path = "src/main.rs"

[dependencies]
giochi-cobrinha-core = { path = "../core" }
giochi-engine = { path = "../../vendor/giochi-engine", default-features = false, features = ["sdl2-system"] }
giochi-engine-3d = { path = "../../vendor/giochi-engine-3d", default-features = false, features = ["sdl2-system"] }
sdl2 = { version = "0.38", default-features = false }
# `libc` já vinha transitivamente pelo `sdl2`, então declarar não baixa nada.
# Serve para uma linha só: restaurar o `SIGPIPE` padrão (ver `main.rs`).
libc = "0.2"
