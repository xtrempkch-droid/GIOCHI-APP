# Workspace, como o launcher: o núcleo não conhece SDL e por isso é testável
# numa máquina sem biblioteca gráfica — que é o caso do CI.
[workspace]
resolver = "2"
members = ["crates/core", "crates/ui-sdl"]
exclude = ["vendor"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Proprietary"
rust-version = "1.82"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
