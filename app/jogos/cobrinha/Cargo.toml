[package]
name = "giochi-cobrinha"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
rust-version = "1.75"
description = "Cobrinha — jogo embarcado de exemplo do Giochi"

[[bin]]
name = "giochi-cobrinha"
path = "src/main.rs"

[dependencies]
# Só SDL2, como o volley: sem ttf, sem asound, sem image. Três `NEEDED`.
sdl2 = { version = "0.37" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
