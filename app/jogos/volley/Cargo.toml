[package]
name = "giochi-volley"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
rust-version = "1.75"
description = "Volley — jogo embarcado de exemplo, escrito para exercitar o aparelho"

[[bin]]
name = "giochi-volley"
path = "src/main.rs"

[dependencies]
# Só SDL2. Nada de `ttf`: o jogo desenha tudo com retângulos e o placar em
# barras de sete segmentos, para rodar em imagem que não tenha biblioteca de
# fonte.
sdl2 = { version = "0.37" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
