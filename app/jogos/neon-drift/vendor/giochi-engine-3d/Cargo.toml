[package]
name = "giochi-engine-3d"
description = "GIOCHI-ENGINE 3D: OpenGL ES 2.0 renderer over EGL, parallel to the 2D engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# `default-features = false` não é optimização: é o que torna `sdl2-system`
# alcançável a partir de quem consome. O Cargo une features no grafo inteiro, e
# um `giochi-engine` sem isto religa em silêncio o `sdl2-bundled` padrão mesmo
# quando o chamador pediu `--features sdl2-system` — e o `sdl2-sys` dá prioridade
# a `bundled`, então o build roda CMake e o cross-compile morre.
giochi-engine = { path = "../giochi-engine", version = "0.4.0", default-features = false }
glow = { workspace = true }
bytemuck = { workspace = true }
tobj = { workspace = true }
glam = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Window, input and audio only. The 3D path never touches `sdl2::render`, which
# belongs to the 2D renderer (ADR-037).
sdl2 = { workspace = true }

[features]
# Compila o SDL2 do código-fonte — o padrão, e o que o CI usa em x86_64.
default = ["sdl2-bundled"]
sdl2-bundled = ["sdl2/bundled", "giochi-engine/sdl2-bundled"]
# Usa o SDL2 do sistema via pkg-config. É o caminho para embarcado, cuja imagem
# já traz o SDL2 com KMSDRM — e é o que permite cross-compilar para aarch64 sem
# compilar uma segunda cópia da biblioteca. Precisa de `--no-default-features`,
# senão `sdl2-bundled` viaja junto e vence.
sdl2-system = ["sdl2/use-pkgconfig", "giochi-engine/sdl2-system"]
# Fase 15: contadores de draw calls/vértices no renderer 3D. Encaminha para a
# feature homónima do core, que também liga o profiler e o overlay.
profiling = ["giochi-engine/profiling"]
