# Loja do PC: compila e prova que roda nos três sistemas.
#
# ## Por que três builds nativos, se o código é o mesmo
#
# Porque "compila" e "roda" são afirmações diferentes, e compilar para outro
# sistema é onde essa diferença fica cara:
#
# - **SDL2 não vem no sistema** no Windows nem no macOS: precisa ser levada junto
#   (`.dll` / `.dylib`). Sem isso o `.exe` abre e fecha na mesma hora, sem
#   mensagem — o pior suporte possível.
# - **No macOS o binário precisa ser assinado** (mesmo que ad-hoc) para o
#   Gatekeeper não matar o processo na primeira execução.
# - **No Linux o loader procura `libSDL2`** em caminhos que variam por
#   distribuição.
#
# Compilar cruzado a partir do Ubuntu produziria três arquivos que ninguém testou
# no sistema de destino. Aqui cada runner roda o binário de verdade, com
# `SDL_VIDEODRIVER=dummy`, e confere que um quadro foi desenhado.
name: Loja (PC)

on:
  pull_request:
    paths:
      - "app/loja/**"
      - "scripts/compilar-loja.sh"
      - "tests/loja/**"
      - ".github/workflows/loja.yml"
  push:
    branches: [main]
    paths:
      - "app/loja/**"
      - "scripts/compilar-loja.sh"
      - ".github/workflows/loja.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Os testes do núcleo não precisam de SDL, de janela nem de GPU: só de Rust.
  # Roda primeiro e em paralelo porque é a parte que pode falhar por lógica.
  nucleo:
    name: núcleo sem SDL
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Testes do núcleo
        run: |
          cd app/loja
          cargo test -p giochi-loja-core
          # Contagem > 0: `cargo test` com zero testes sai com 0, e um verde que
          # não rodou nada é o falso positivo mais fácil de todos.
          N=$(cargo test -p giochi-loja-core 2>&1 | sed -n 's/^test result: ok\. \([0-9]\+\) passed.*/\1/p' | head -1)
          echo "testes do núcleo: $N"
          test "${N:-0}" -gt 0

  construir:
    name: construir e rodar em ${{ matrix.rotulo }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - so: ubuntu-24.04
            rotulo: linux
          - so: windows-2022
            rotulo: windows
          - so: macos-15 # arm64: é o Mac que o usuário tem hoje (macos-14 morreu em 02/11/2026)
            rotulo: macos
    runs-on: ${{ matrix.so }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # ── dependências de SDL2 ───────────────────────────────
      - name: SDL2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev
          # A fonte não vai no repositório (decisão do launcher, mantida aqui):
          # sem ela o texto não desenha e o quadro se parece com um app quebrado.
          sudo apt-get install -y fonts-dejavu-core

      - name: SDL2 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 sdl2_ttf

      - name: SDL2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # **Não vcpkg.** O primeiro run falhou aqui, e a causa é o que o
          # `sdl2-sys` faz por padrão: sem as features `use-vcpkg`/`use-pkgconfig`
          # ele emite só `-l SDL2` e deixa o linker procurar. O `LIB` do MSVC é
          # quem resolve isso; o `vcpkg` só ajudaria se eu ligasse a feature,
          # que quebraria Linux e macOS.
          #
          # Os zips oficiais ("VC") são determinísticos, não compilam nada e
          # trazem `include/` + `lib/x64/` prontos. Versão fixa: um runner que
          # atualiza sozinho transforma "passou ontem" em "quebrou hoje".
          $ErrorActionPreference = "Stop"
          $sdl = "C:\sdl2"
          New-Item -ItemType Directory -Force -Path $sdl | Out-Null

          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-devel-2.30.9-VC.zip" -OutFile "$sdl\sdl2.zip"
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.22.0/SDL2_ttf-devel-2.22.0-VC.zip" -OutFile "$sdl\ttf.zip"
          Expand-Archive "$sdl\sdl2.zip" -DestinationPath $sdl -Force
          Expand-Archive "$sdl\ttf.zip" -DestinationPath $sdl -Force

          $sdlDir = (Get-ChildItem $sdl -Directory | Where-Object { $_.Name -like "SDL2-2*" } | Select-Object -First 1).FullName
          $ttfDir = (Get-ChildItem $sdl -Directory | Where-Object { $_.Name -like "SDL2_ttf-2*" } | Select-Object -First 1).FullName

          # `SDL2_ttf.h` inclui `SDL2/SDL.h`, então os dois includes têm de estar
          # no mesmo caminho de busca.
          $env:SDL2_INCLUDE_PATH = "$sdlDir\include;$ttfDir\include"
          # O linker do MSVC usa `LIB`, não `-L`.
          $env:LIB = "$sdlDir\lib\x64;$ttfDir\lib\x64;$env:LIB"

          "SDL2_INCLUDE_PATH=$env:SDL2_INCLUDE_PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIB=$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SDL2_BIN=$sdlDir\lib\x64;$ttfDir\lib\x64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "SDL2: $sdlDir"
          Write-Host "SDL2_ttf: $ttfDir"

      # ── build ──────────────────────────────────────────────
      - name: Compilar (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        # A feature `texto` é o padrão. Sem `SDL2_ttf` o build falha no link, e
        # é melhor falhar aqui do que distribuir um app sem texto.
        run: |
          cd app/loja
          if [ "$RUNNER_OS" = "macOS" ]; then
            export LIBRARY_PATH="$(brew --prefix)/lib"
            export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig"
          fi
          cargo build --release
          ls -la target/release/

      - name: Compilar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd app/loja
          cargo build --release
          Get-ChildItem target\release\

      # ── a prova que importa: o binário desenha ─────────────
      - name: O binário desenha um quadro (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd app/loja
          if [ "$RUNNER_OS" = "macOS" ]; then export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"; fi
          # `dummy` = sem tela. É o mesmo caminho que o launcher usa e o que
          # permite verificar desenho em runner sem display.
          SDL_VIDEODRIVER=dummy ./target/release/giochi-loja --dump-frame /tmp/quadro.bmp
          test -s /tmp/quadro.bmp
          # 1 180 x 760 x 4 + cabeçalho de 54 bytes. Um BMP de tamanho errado
          # significa que o `read_pixels` devolveu outra coisa.
          ESPERADO=$((1180 * 760 * 4 + 54))
          TAM=$(wc -c < /tmp/quadro.bmp)
          echo "quadro: $TAM bytes (esperado $ESPERADO)"
          test "$TAM" -eq "$ESPERADO"

      - name: O binário desenha um quadro (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd app/loja
          $env:SDL_VIDEODRIVER = "dummy"
          # As DLLs do vcpkg precisam estar ao lado do .exe, senão o processo
          # morre antes de desenhar e o erro é "0xc0000135".
          # A DLL tem de ficar ao lado do .exe: o Windows não procura no
          # diretório do lib, e a falha é "0xc0000135" sem mais nada.
          foreach ($dir in $env:SDL2_BIN.Split(";")) {
            if (Test-Path $dir) { Copy-Item "$dir\*.dll" target\release\ -Force }
          }
          Get-ChildItem target\release\*.dll | Select-Object Name
          .\target\release\giochi-loja.exe --dump-frame $env:TEMP\quadro.bmp
          $tam = (Get-Item $env:TEMP\quadro.bmp).Length
          $esperado = 1180 * 760 * 4 + 54
          Write-Host "quadro: $tam bytes (esperado $esperado)"
          if ($tam -ne $esperado) { exit 1 }

      # ── navegação: teclas mudam a tela ─────────────────────
      - name: A navegação muda a tela (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd app/loja
          if [ "$RUNNER_OS" = "macOS" ]; then export DYLD_LIBRARY_PATH="$(brew --prefix)/lib"; fi
          export SDL_VIDEODRIVER=dummy
          # `--json`: a saída de máquina é JSON ASCII, sem texto acentuado.
          # Verificar `"seleção: 2"` funciona no Linux e falha no Windows, onde o
          # PowerShell lê a saída de processo nativo com a code page OEM e o
          # acento vira lixo. Já custou uma rodada nos apps de Python.
          ./target/release/giochi-loja --teclas down,down --json --dump-frame /tmp/baixo.bmp > /tmp/saida.json
          cat /tmp/saida.json
          grep -q '"selecao":2' /tmp/saida.json
          # E o quadro tem de ser diferente do primeiro: seleção diferente é
          # pixel diferente. `cmp -s` devolve 1 quando difere.
          if cmp -s /tmp/quadro.bmp /tmp/baixo.bmp; then
            echo "os dois quadros são idênticos — a navegação não desenhou nada"
            exit 1
          fi

      - name: A navegação muda a tela (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd app/loja
          $env:SDL_VIDEODRIVER = "dummy"
          # `--json` e nada de acento: `-match "seleção: 2"` sobre a saída de um
          # processo nativo falha aqui, porque o PowerShell 5.1 decodifica com a
          # code page OEM. E `-notmatch` num array de linhas *filtra* em vez de
          # testar, então a condição ficava sempre verdadeira — os dois motivos
          # juntos fizeram esta perna falhar duas vezes.
          $saida = .\target\release\giochi-loja.exe --teclas down,down --json --dump-frame $env:TEMP\baixo.bmp
          $saida | Out-Host
          if ($saida -notmatch '"selecao":2') {
            Write-Host "a selecao nao foi para 2"
            exit 1
          }
          $a = Get-FileHash $env:TEMP\quadro.bmp
          $b = Get-FileHash $env:TEMP\baixo.bmp
          if ($a.Hash -eq $b.Hash) { Write-Host "quadros identicos"; exit 1 }

      # O artefato precisa ser **executável por quem baixa**, não só "o binário".
      #
      # No Windows isso significa as DLLs do SDL2 ao lado do `.exe`: sem elas o
      # processo morre com `0xc0000135` e nenhuma mensagem. No macOS, o Gatekeeper
      # recusa binário não assinado — assinatura ad-hoc não é notarização, mas é o
      # que faz o arquivo abrir em vez de ser bloqueado.
      - name: Assinatura ad-hoc (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - app/loja/target/release/giochi-loja
          codesign --verify --verbose app/loja/target/release/giochi-loja

      - name: Empacotar o artefato
        shell: bash
        run: |
          mkdir -p dist/loja
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp app/loja/target/release/giochi-loja.exe dist/loja/
            cp app/loja/target/release/*.dll dist/loja/ 2>/dev/null || true
          else
            cp app/loja/target/release/giochi-loja dist/loja/
          fi
          cp app/loja/README.md dist/loja/ 2>/dev/null || true
          ls -la dist/loja/

      - name: Anexar binários
        uses: actions/upload-artifact@v4
        with:
          name: loja-${{ matrix.rotulo }}
          path: dist/loja/**
          if-no-files-found: error
          retention-days: 14
