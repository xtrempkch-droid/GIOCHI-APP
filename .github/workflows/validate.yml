name: Validate apps

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "package.json"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate apps
        run: node scripts/validate-app.mjs --all

      - name: Run tests
        run: node tests/run-all.mjs

  # O núcleo do launcher não tem nenhuma dependência: compila e testa em
  # qualquer runner, sem SDL, sem GPU, sem placa. É aqui que a lógica de
  # navegação, foco e gamepad está — então é o teste que mais importa.
  launcher-core:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Test core
        working-directory: app/launcher
        run: cargo test -p giochi-launcher-core --locked

  # O `rustc` compila o `ui-sdl` sem SDL; quem falha é o link. Este job existe
  # porque essa distinção já custou tempo: sem ele, o verde do job acima daria
  # a impressão de que o launcher inteiro compila.
  launcher-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev

      - name: Build workspace
        working-directory: app/launcher
        run: cargo build --workspace --locked

      # O `texto` é feature porque `SDL2_ttf` é dependência de **link**: a
      # imagem antiga do X55 não a tinha, e sem a feature o launcher desenha
      # tudo menos os glifos. Cada combinação precisa compilar — a de "sem
      # texto" esteve quebrada (`missing field design`, esquecido quando o
      # layout adaptativo entrou) sem ninguém notar, porque só o build padrão
      # rodava. Um `cfg` que nunca é compilado é código que não existe.
      #
      # O mixer ALSA não aparece aqui: ele é `dlopen` em tempo de execução, sem
      # feature e sem `-lasound`.
      # A imagem nova não tem `/opt/giochi/apps/index.json` — o Giochi System
      # avisou disso pelo canal. Antes, o launcher respondia com quatro jogos de
      # demonstração que **não existem no aparelho**: cartão que aparece e não
      # abre, que é o que `podar_sem_binario` existe para impedir.
      #
      # A regra agora é: sem catálogo, tela vazia e honesta; demonstração só com
      # `--demo`. A asserção é por texto no log, não por contagem de cores, que
      # quebraria na primeira mudança de paleta.
      - name: Catalogo ausente nao inventa jogos
        working-directory: app/launcher
        run: |
          set -e
          printf '{"schemaVersion":1,"apps":[]}\n' > /tmp/vazio.json
          export SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software
          export GIOCHI_CATALOGO=/tmp/vazio.json

          ./target/debug/giochi-launcher --dump-frame /tmp/sem.bmp \
            --tamanho 640x480 > /tmp/sem.log 2>&1
          test -s /tmp/sem.bmp
          grep -q "nenhum app com binário presente" /tmp/sem.log
          if grep -q "demonstração" /tmp/sem.log; then
            echo "sem --demo o launcher nao pode usar o catalogo de demonstracao"
            exit 1
          fi
          echo "sem catalogo: tela vazia, sem cartao falso"

          ./target/debug/giochi-launcher --demo --dump-frame /tmp/com.bmp \
            --tamanho 640x480 > /tmp/com.log 2>&1
          grep -q -- "--demo: usando catálogo de demonstração" /tmp/com.log
          echo "--demo: catalogo de demonstracao, como pedido"

      - name: Build com e sem texto
        working-directory: app/launcher/crates/ui-sdl
        run: |
          set -e
          echo "::group::padrão (com texto)"
          cargo build --locked
          echo "::endgroup::"
          echo "::group::sem texto"
          cargo build --locked --no-default-features
          echo "::endgroup::"

  # O jogo, em dois jobs pelo mesmo motivo do launcher: o núcleo não precisa de
  # SDL, e quem falha sem ele é o link. Sem a separação, um verde do núcleo daria
  # a impressão de que o jogo inteiro compila.
  cobrinha-core:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Test core (sem SDL)
        working-directory: app/jogos/cobrinha
        run: cargo test -p giochi-cobrinha-core --locked

  # Os testes da interface não precisam de janela; precisam de SDL2 para linkar.
  #
  # A prova de desenho, porém, precisa de um contexto GL: o cobrinha desenha pela
  # GIOCHI-ENGINE 3D. O driver `dummy` do SDL **não tem OpenGL** ("OpenGL support
  # is either not configured in SDL or not available in current SDL video driver
  # (dummy)"), e é isso que deixou este job vermelho de #45 a #61 — a captura
  # nunca chegava a desenhar. `offscreen` dá um contexto EGL/GLES real sem
  # display, e é o que `GIOCHI-ENGINE-3D/.github/workflows/ci.yml` usa há fases.
  cobrinha-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install SDL2 and software GL
        # O cobrinha desenha pela GIOCHI-ENGINE 3D, que exige um contexto GL.
        # `libsdl2-dev` sozinho nao traz o driver GL por software (llvmpipe), e
        # sem ele o SDL responde "OpenGL support is either not configured in SDL
        # or not available in current SDL video driver". Ver a nota equivalente
        # em `GIOCHI-ENGINE-3D/.github/workflows/ci.yml`, que ja passou por isto.
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri

      - name: Test workspace
        working-directory: app/jogos/cobrinha
        run: cargo test --workspace --locked

      # Desenhar é diferente de compilar. Este passo exige um quadro do tamanho
      # exato e com as cores da paleta: um BMP preto passaria num teste que só
      # conferisse "o arquivo existe".
      - name: Desenha em 640x480 (o painel do RK3326)
        working-directory: app/jogos/cobrinha
        run: |
          set -e
          SDL_VIDEODRIVER=offscreen \
            cargo run --quiet -- --tamanho 640x480 --passos 60 \
              --quadro /tmp/cobrinha.bmp
          test -s /tmp/cobrinha.bmp
          # Lê o cabeçalho em vez de fixar o tamanho do arquivo: o SDL grava
          # BITMAPV4HEADER (108 bytes) e um número mágico quebraria na próxima
          # versão sem nada estar errado. O que importa é dimensão e bpp.
          python3 - /tmp/cobrinha.bmp <<'PY'
          import struct, sys
          dados = open(sys.argv[1], "rb").read(30)
          assert dados[:2] == b"BM", "não é BMP"
          largura, altura = struct.unpack_from("<ii", dados, 18)
          bpp = struct.unpack_from("<H", dados, 28)[0]
          print(f"quadro: {largura}x{altura} {bpp} bpp, {len(open(sys.argv[1], 'rb').read())} bytes")
          assert (largura, altura) == (640, 480), (largura, altura)
          assert bpp == 32, bpp
          PY

      # O ritmo é a exigência do projeto: 45 fps sem upscaling. O modo `--json`
      # existe para isto — saída ASCII, sem acento que quebre comparação.
      #
      # **No runner não há GPU**: o GL é o llvmpipe, que rasteriza na CPU. Medido
      # aqui: 69,2 fps com 88 dos 90 quadros "atrasados" — os dois números medem a
      # máquina do CI, não o jogo. Comparar com a faixa do aparelho daria um teste
      # que reprova por ser rápido e passa por ser lento, que é o contrário do que
      # se quer saber.
      #
      # Então o piso de 45 fps e a ausência de atraso continuam valendo **onde há
      # GPU** (quem rodar sem `GIOCHI_SOFTWARE_GL`), e no CI fica o que é
      # independente da máquina: 90 quadros, a geometria da célula, e o limitador
      # respeitado. O piso de verdade é medido no aparelho, por `aparelho.sh`.
      - name: Sustenta o ritmo e respeita o teto em 640x480
        working-directory: app/jogos/cobrinha
        env:
          GIOCHI_SOFTWARE_GL: "1"
        run: |
          set -e
          saida=$(SDL_VIDEODRIVER=offscreen \
            cargo run --quiet -- --tamanho 640x480 --quadros 90 --json)
          echo "$saida"
          python3 - "$saida" <<'PY'
          import json, os, sys
          dados = json.loads(sys.argv[1])
          assert dados["quadros"] == 90, dados
          # Aqui havia `assert dados["celula"] == 22`, que NUNCA pode rodar: o
          # `--json` do cobrinha nao tem a chave `celula` (tem quadros, passos,
          # segundos, fps, fps_teto, pontos, atrasados, gles, instancing). A
          # assercao so nao aparecia porque o passo morria antes, no fps.
          #
          # O tamanho da celula continua coberto, e no lugar certo: os testes de
          # `geometria.rs` prendem que ela e inteira, que cabe no painel, que e a
          # maior possivel e que painel maior da celula maior. O valor em pixels
          # do quadro desenhado depende da escala automatica (o log mostra
          # `escala 1.25`), entao nao e invariante de CI.
          # Vale nas duas máquinas: o limitador não pode ser ignorado.
          assert dados["fps"] <= dados["fps_teto"] + 1.0, f"teto ignorado: {dados}"
          if os.environ.get("GIOCHI_SOFTWARE_GL") == "1":
              print(f"GL por software (llvmpipe): {dados['fps']} fps, "
                    f"{dados['atrasados']} quadros atrasados — não é medição do aparelho")
          else:
              assert 40.0 <= dados["fps"] <= 50.0, f"fps fora da faixa: {dados['fps']}"
              assert dados["atrasados"] == 0, f"quadros atrasados: {dados['atrasados']}"
          PY

      # A rotação do X55 tem de continuar valendo. 720x1280 é painel retrato:
      # o projeto sai 1280x720 e o BMP tem 720x1280.
      - name: Painel retrato gira (o caso do X55)
        working-directory: app/jogos/cobrinha
        run: |
          set -e
          SDL_VIDEODRIVER=offscreen \
            cargo run --quiet -- --tamanho 720x1280 --passos 40 \
              --quadro /tmp/retrato.bmp | tee /tmp/retrato.log
          # O `grep` antigo era `projeto 1280x720 (Ccw90)` e passou a falhar
          # quando a mensagem virou "projeto 1280x720, rotação Ccw90 (formato do
          # painel)". Nada do desenho estava errado -- o BMP saiu 720x1280 -- mas
          # o teste conferia a PROSA do log. A tolerância abaixo aceita as duas
          # formas; o que importa (projeto deitado e rotação Ccw90) continua
          # exigido.
          grep -Eq "projeto 1280x720,?[^)]*Ccw90" /tmp/retrato.log
          python3 - /tmp/retrato.bmp <<'PY'
          import struct, sys
          dados = open(sys.argv[1], "rb").read(30)
          largura, altura = struct.unpack_from("<ii", dados, 18)
          print(f"quadro retrato: {largura}x{altura}")
          assert (largura, altura) == (720, 1280), (largura, altura)
          PY
