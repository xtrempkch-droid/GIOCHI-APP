name: Validate apps

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "package.json"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate apps
        run: node scripts/validate-app.mjs --all

      - name: Run tests
        run: node tests/run-all.mjs

  # O núcleo do launcher não tem nenhuma dependência: compila e testa em
  # qualquer runner, sem SDL, sem GPU, sem placa. É aqui que a lógica de
  # navegação, foco e gamepad está — então é o teste que mais importa.
  launcher-core:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Test core
        working-directory: app/launcher
        run: cargo test -p giochi-launcher-core --locked

  # O núcleo do app de música, pela mesma razão do launcher-core: sem SDL, sem
  # GPU e sem o repositório irmão da engine, ele roda em qualquer runner. É onde
  # estão as decisões que erram calado — ordem natural das faixas, o que fazer ao
  # apertar A, geometria do carrossel, layout em cada painel e a rotação.
  #
  # O **binário** do app fica de fora, como o `launcher-teste`: ele depende do
  # `GIOCHI-ENGINE-3D`, que este CI não tem. Fingir que compila seria pior que
  # não compilar — o verde diria que o app inteiro passa.
  musica-core:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Test core
        working-directory: app/musica/crates/core
        run: cargo test --locked

      - name: Clippy do núcleo
        working-directory: app/musica/crates/core
        run: cargo clippy --all-targets --locked -- -D warnings

  # O `rustc` compila o `ui-sdl` sem SDL; quem falha é o link. Este job existe
  # porque essa distinção já custou tempo: sem ele, o verde do job acima daria
  # a impressão de que o launcher inteiro compila.
  launcher-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev

      - name: Build workspace
        working-directory: app/launcher
        run: cargo build --workspace --locked

      # `-D warnings` e não só "rodar clippy".
      #
      # Em 15/11/2026 havia 21 avisos acumulados entre as quatro crates —
      # `rotacao_do_sistema` nunca usado, `sort_by` que devia ser `sort_by_key`,
      # `let _ =` em valor unitário, `loop`+`match` que era um `while let`,
      # `u8 * 32` que estourava a partir da nona faixa. Nenhum quebrava teste, e
      # por isso nenhum apareceu: **aviso que ninguém lê é aviso que não existe.**
      #
      # O `launcher-teste` fica de fora porque depende do repositório irmão
      # `GIOCHI-ENGINE-3D`, que o CI não tem.
      - name: Clippy (avisos sao erro)
        run: |
          set -e
          for app in launcher launcher-star-dust loja; do
            echo "::group::$app"
            ( cd "app/$app" && cargo clippy --all-targets --locked -- -D warnings )
            echo "::endgroup::"
          done

      # O `texto` é feature porque `SDL2_ttf` é dependência de **link**: a
      # imagem antiga do X55 não a tinha, e sem a feature o launcher desenha
      # tudo menos os glifos. Cada combinação precisa compilar — a de "sem
      # texto" esteve quebrada (`missing field design`, esquecido quando o
      # layout adaptativo entrou) sem ninguém notar, porque só o build padrão
      # rodava. Um `cfg` que nunca é compilado é código que não existe.
      #
      # O mixer ALSA não aparece aqui: ele é `dlopen` em tempo de execução, sem
      # feature e sem `-lasound`.
      # A imagem nova não tem `/opt/giochi/apps/index.json` — o Giochi System
      # avisou disso pelo canal. Antes, o launcher respondia com quatro jogos de
      # demonstração que **não existem no aparelho**: cartão que aparece e não
      # abre, que é o que `podar_sem_binario` existe para impedir.
      #
      # A regra agora é: sem catálogo, tela vazia e honesta; demonstração só com
      # `--demo`. A asserção é por texto no log, não por contagem de cores, que
      # quebraria na primeira mudança de paleta.
      - name: Catalogo ausente nao inventa jogos
        working-directory: app/launcher
        run: |
          set -e
          printf '{"schemaVersion":1,"apps":[]}\n' > /tmp/vazio.json
          export SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software
          export GIOCHI_CATALOGO=/tmp/vazio.json

          ./target/debug/giochi-launcher --dump-frame /tmp/sem.bmp \
            --tamanho 640x480 > /tmp/sem.log 2>&1
          test -s /tmp/sem.bmp
          # A mensagem é a que o código emite: quando a detecção não acha nada
          # ela diz as quatro raízes que varreu. Antes o check procurava
          # "nenhum app com binário presente", texto que deixou de existir
          # quando o catálogo passou a ser detectado do disco — e um grep preso
          # a uma frase antiga reprova o CI sem nada de errado no app.
          grep -q "nenhum app encontrado em /opt/giochi/games, /user/games, /opt/giochi/apps, /user/apps" /tmp/sem.log
          if grep -q "demonstração" /tmp/sem.log; then
            echo "sem --demo o launcher nao pode usar o catalogo de demonstracao"
            exit 1
          fi
          echo "sem catalogo: tela vazia, sem cartao falso"

          ./target/debug/giochi-launcher --demo --dump-frame /tmp/com.bmp \
            --tamanho 640x480 > /tmp/com.log 2>&1
          grep -q -- "--demo: usando catálogo de demonstração" /tmp/com.log
          echo "--demo: catalogo de demonstracao, como pedido"

      - name: Build com e sem texto
        working-directory: app/launcher/crates/ui-sdl
        run: |
          set -e
          echo "::group::padrão (com texto)"
          cargo build --locked
          echo "::endgroup::"
          echo "::group::sem texto"
          cargo build --locked --no-default-features
          echo "::endgroup::"
