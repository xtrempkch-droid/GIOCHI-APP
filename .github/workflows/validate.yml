name: Validate apps

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "package.json"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate apps
        run: node scripts/validate-app.mjs --all

      - name: Run tests
        run: node tests/run-all.mjs

  # O núcleo do launcher não tem nenhuma dependência: compila e testa em
  # qualquer runner, sem SDL, sem GPU, sem placa. É aqui que a lógica de
  # navegação, foco e gamepad está — então é o teste que mais importa.
  launcher-core:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Test core
        working-directory: app/launcher
        run: cargo test -p giochi-launcher-core --locked

  # O `rustc` compila o `ui-sdl` sem SDL; quem falha é o link. Este job existe
  # porque essa distinção já custou tempo: sem ele, o verde do job acima daria
  # a impressão de que o launcher inteiro compila.
  launcher-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev

      - name: Build workspace
        working-directory: app/launcher
        run: cargo build --workspace --locked

      # O `texto` é feature porque `SDL2_ttf` é dependência de **link**: a
      # imagem antiga do X55 não a tinha, e sem a feature o launcher desenha
      # tudo menos os glifos. Cada combinação precisa compilar — a de "sem
      # texto" esteve quebrada (`missing field design`, esquecido quando o
      # layout adaptativo entrou) sem ninguém notar, porque só o build padrão
      # rodava. Um `cfg` que nunca é compilado é código que não existe.
      #
      # O mixer ALSA não aparece aqui: ele é `dlopen` em tempo de execução, sem
      # feature e sem `-lasound`.
      # A imagem nova não tem `/opt/giochi/apps/index.json` — o Giochi System
      # avisou disso pelo canal. Antes, o launcher respondia com quatro jogos de
      # demonstração que **não existem no aparelho**: cartão que aparece e não
      # abre, que é o que `podar_sem_binario` existe para impedir.
      #
      # A regra agora é: sem catálogo, tela vazia e honesta; demonstração só com
      # `--demo`. A asserção é por texto no log, não por contagem de cores, que
      # quebraria na primeira mudança de paleta.
      - name: Catalogo ausente nao inventa jogos
        working-directory: app/launcher
        run: |
          set -e
          printf '{"schemaVersion":1,"apps":[]}\n' > /tmp/vazio.json
          export SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software
          export GIOCHI_CATALOGO=/tmp/vazio.json

          ./target/debug/giochi-launcher --dump-frame /tmp/sem.bmp \
            --tamanho 640x480 > /tmp/sem.log 2>&1
          test -s /tmp/sem.bmp
          grep -q "nenhum app com binário presente" /tmp/sem.log
          if grep -q "demonstração" /tmp/sem.log; then
            echo "sem --demo o launcher nao pode usar o catalogo de demonstracao"
            exit 1
          fi
          echo "sem catalogo: tela vazia, sem cartao falso"

          ./target/debug/giochi-launcher --demo --dump-frame /tmp/com.bmp \
            --tamanho 640x480 > /tmp/com.log 2>&1
          grep -q -- "--demo: usando catálogo de demonstração" /tmp/com.log
          echo "--demo: catalogo de demonstracao, como pedido"

      - name: Build com e sem texto
        working-directory: app/launcher/crates/ui-sdl
        run: |
          set -e
          echo "::group::padrão (com texto)"
          cargo build --locked
          echo "::endgroup::"
          echo "::group::sem texto"
          cargo build --locked --no-default-features
          echo "::endgroup::"

  # O jogo, em dois jobs pelo mesmo motivo do launcher: o núcleo não precisa de
  # SDL, e quem falha sem ele é o link. Sem a separação, um verde do núcleo daria
  # a impressão de que o jogo inteiro compila.
  cobrinha-core:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Test core (sem SDL)
        working-directory: app/jogos/cobrinha
        run: cargo test -p giochi-cobrinha-core --locked

  # Os testes da interface não precisam de janela; precisam de SDL2 para linkar.
  #
  # A prova de desenho, porém, precisa de um contexto GL: o cobrinha desenha pela
  # GIOCHI-ENGINE 3D. O driver `dummy` do SDL **não tem OpenGL** ("OpenGL support
  # is either not configured in SDL or not available in current SDL video driver
  # (dummy)"), e é isso que deixou este job vermelho de #45 a #61 — a captura
  # nunca chegava a desenhar. `offscreen` dá um contexto EGL/GLES real sem
  # display, e é o que `GIOCHI-ENGINE-3D/.github/workflows/ci.yml` usa há fases.
  cobrinha-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install SDL2 and software GL
        # O cobrinha desenha pela GIOCHI-ENGINE 3D, que exige um contexto GL.
        # `libsdl2-dev` sozinho nao traz o driver GL por software (llvmpipe), e
        # sem ele o SDL responde "OpenGL support is either not configured in SDL
        # or not available in current SDL video driver". Ver a nota equivalente
        # em `GIOCHI-ENGINE-3D/.github/workflows/ci.yml`, que ja passou por isto.
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri

      - name: Test workspace
        working-directory: app/jogos/cobrinha
        run: cargo test --workspace --locked

      # Desenhar é diferente de compilar. Este passo exige um quadro do tamanho
      # exato e com as cores da paleta: um BMP preto passaria num teste que só
      # conferisse "o arquivo existe".
      - name: Desenha em 640x480 (o painel do RK3326)
        working-directory: app/jogos/cobrinha
        run: |
          set -e
          SDL_VIDEODRIVER=offscreen \
            cargo run --quiet -- --tamanho 640x480 --passos 60 \
              --quadro /tmp/cobrinha.bmp
          test -s /tmp/cobrinha.bmp
          # Lê o cabeçalho em vez de fixar o tamanho do arquivo: o SDL grava
          # BITMAPV4HEADER (108 bytes) e um número mágico quebraria na próxima
          # versão sem nada estar errado. O que importa é dimensão e bpp.
          python3 - /tmp/cobrinha.bmp <<'PY'
          import struct, sys
          dados = open(sys.argv[1], "rb").read(30)
          assert dados[:2] == b"BM", "não é BMP"
          largura, altura = struct.unpack_from("<ii", dados, 18)
          bpp = struct.unpack_from("<H", dados, 28)[0]
          print(f"quadro: {largura}x{altura} {bpp} bpp, {len(open(sys.argv[1], 'rb').read())} bytes")
          assert (largura, altura) == (640, 480), (largura, altura)
          assert bpp == 32, bpp
          PY

      # O ritmo é a exigência do projeto: 45 fps sem upscaling. O modo `--json`
      # existe para isto — saída ASCII, sem acento que quebre comparação.
      #
      # **No runner não há GPU**: o GL é o llvmpipe, que rasteriza na CPU. Medido
      # aqui: 69,2 fps com 88 dos 90 quadros "atrasados" — os dois números medem a
      # máquina do CI, não o jogo. Comparar com a faixa do aparelho daria um teste
      # que reprova por ser rápido e passa por ser lento, que é o contrário do que
      # se quer saber.
      #
      # Então o piso de 45 fps e a ausência de atraso continuam valendo **onde há
      # GPU** (quem rodar sem `GIOCHI_SOFTWARE_GL`), e no CI fica o que é
      # independente da máquina: 90 quadros, a geometria da célula, e o limitador
      # respeitado. O piso de verdade é medido no aparelho, por `aparelho.sh`.
      - name: Sustenta o ritmo e respeita o teto em 640x480
        working-directory: app/jogos/cobrinha
        env:
          GIOCHI_SOFTWARE_GL: "1"
        run: |
          set -e
          saida=$(SDL_VIDEODRIVER=offscreen \
            cargo run --quiet -- --tamanho 640x480 --quadros 90 --json)
          echo "$saida"
          python3 - "$saida" <<'PY'
          import json, os, sys
          dados = json.loads(sys.argv[1])
          assert dados["quadros"] == 90, dados
          # Aqui havia `assert dados["celula"] == 22`, que NUNCA pode rodar: o
          # `--json` do cobrinha nao tem a chave `celula` (tem quadros, passos,
          # segundos, fps, fps_teto, pontos, atrasados, gles, instancing). A
          # assercao so nao aparecia porque o passo morria antes, no fps.
          #
          # O tamanho da celula continua coberto, e no lugar certo: os testes de
          # `geometria.rs` prendem que ela e inteira, que cabe no painel, que e a
          # maior possivel e que painel maior da celula maior. O valor em pixels
          # do quadro desenhado depende da escala automatica (o log mostra
          # `escala 1.25`), entao nao e invariante de CI.
          # Vale nas duas máquinas: o limitador não pode ser ignorado.
          assert dados["fps"] <= dados["fps_teto"] + 1.0, f"teto ignorado: {dados}"
          if os.environ.get("GIOCHI_SOFTWARE_GL") == "1":
              print(f"GL por software (llvmpipe): {dados['fps']} fps, "
                    f"{dados['atrasados']} quadros atrasados — não é medição do aparelho")
          else:
              assert 40.0 <= dados["fps"] <= 50.0, f"fps fora da faixa: {dados['fps']}"
              assert dados["atrasados"] == 0, f"quadros atrasados: {dados['atrasados']}"
          PY

      # A rotação do X55 tem de continuar valendo. 720x1280 é painel retrato:
      # o projeto sai 1280x720 e o BMP tem 720x1280.
      - name: Painel retrato gira (o caso do X55)
        working-directory: app/jogos/cobrinha
        run: |
          set -e
          SDL_VIDEODRIVER=offscreen \
            cargo run --quiet -- --tamanho 720x1280 --passos 40 \
              --quadro /tmp/retrato.bmp | tee /tmp/retrato.log
          # O `grep` antigo era `projeto 1280x720 (Ccw90)` e passou a falhar
          # quando a mensagem virou "projeto 1280x720, rotação Ccw90 (formato do
          # painel)". Nada do desenho estava errado -- o BMP saiu 720x1280 -- mas
          # o teste conferia a PROSA do log. A tolerância abaixo aceita as duas
          # formas; o que importa (projeto deitado e rotação Ccw90) continua
          # exigido.
          grep -Eq "projeto 1280x720,?[^)]*Ccw90" /tmp/retrato.log
          python3 - /tmp/retrato.bmp <<'PY'
          import struct, sys
          dados = open(sys.argv[1], "rb").read(30)
          largura, altura = struct.unpack_from("<ii", dados, 18)
          print(f"quadro retrato: {largura}x{altura}")
          assert (largura, altura) == (720, 1280), (largura, altura)
          PY

  # O tower defense, em dois jobs pelo mesmo motivo dos outros: compilar,
  # testar e **desenhar** são afirmações diferentes.
  giochi-tower-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      # Estes eram os nomes do Ubuntu 22.04. No 24.04 (noble) o runtime de
      # EGL/GLES vem do libglvnd: `libegl1-mesa` e `libgles2-mesa` **nao
      # existem** e o `apt-get` responde `E: Unable to locate package`, que
      # derruba o job inteiro antes de compilar uma linha. Os `-dev`
      # (`libegl1-mesa-dev`) continuam resolvendo — so os de runtime mudaram.
      # O `vendor/Cargo.toml` da engine liga as features `image`, `mixer` e `ttf`
      # do crate `sdl2`, e o `sdl2-sys` exige o `.pc` das **tres** no build,
      # mesmo quando o binario final nao acaba pedindo a `.so` (`--as-needed`
      # descarta `SDL2_ttf`, que o jogo nao referencia). Medido no binario:
      # 6 NEEDED, com `libSDL2_image-2.0.so.0` e sem `libSDL2_ttf`.
      # Ou seja: build e carga tem conjuntos diferentes, e o CI precisa cobrir o
      # maior — `Package SDL2_ttf was not found` derruba o job antes de compilar.
      - name: Install SDL2 (e o mixer e a imagem, que o binario pede)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libsdl2-image-dev libsdl2-ttf-dev libegl1 libgles2 libgl1-mesa-dri

      # O snapshot do engine e um workspace proprio (`exclude = vendor`):
      # `--workspace` aqui testa o jogo, nao os testes da engine.
      - name: Testes
        working-directory: app/jogos/giochi-tower
        run: cargo test --locked

      - name: Clippy
        working-directory: app/jogos/giochi-tower
        run: cargo clippy --all-targets --locked -- -D warnings

      # `dummy` NAO tem OpenGL e o jogo falha com "OpenGL support is either not
      # configured" — erro que parece defeito do jogo e e do driver de video.
      # `offscreen` tem EGL. Mesma armadilha ja documentada para o cobrinha.
      - name: Desenha em 640x480 (o painel do RK3326)
        working-directory: app/jogos/giochi-tower
        run: |
          set -e
          SDL_VIDEODRIVER=offscreen \
            cargo run --quiet -- --tamanho 640x480 --frames 60 \
              --quadro /tmp/tower.bmp
          test -s /tmp/tower.bmp
          python3 - /tmp/tower.bmp <<'PY'
          import struct, sys
          dados = open(sys.argv[1], "rb").read(30)
          assert dados[:2] == b"BM", "não é BMP"
          largura, altura = struct.unpack_from("<ii", dados, 18)
          print(f"quadro: {largura}x{altura}")
          assert (largura, altura) == (640, 480), (largura, altura)
          PY

      # A captura tem de sair **uma vez**, no ultimo quadro: gravar dentro do
      # laco escrevia o BMP 60 vezes e enchia o log.
      - name: A captura e do ultimo quadro, nao de todos
        working-directory: app/jogos/giochi-tower
        run: |
          set -e
          SDL_VIDEODRIVER=offscreen \
            cargo run --quiet -- --tamanho 640x480 --frames 30 \
              --quadro /tmp/ultimo.bmp 2> /tmp/tower.log
          n=$(grep -c "quadro: " /tmp/tower.log || true)
          echo "linhas de captura: $n"
          test "$n" -eq 1

      # "Desenhou" e "desenhou o HUD" sao afirmacoes diferentes. A cor de cada
      # elemento do HUD e uma constante conhecida, entao a captura e procurada
      # por ela: um texto que nao aparece tem de reprovar aqui, e nao na mao de
      # quem olha a tela.
      - name: O HUD desenha de verdade
        working-directory: app/jogos/giochi-tower
        run: |
          set -e
          SDL_VIDEODRIVER=offscreen cargo run --quiet -- \
            --tamanho 640x480 --frames 30 --quadro /tmp/hud.bmp
          SDL_VIDEODRIVER=offscreen cargo run --quiet -- \
            --tamanho 640x480 --frames 30 --sem-ui --quadro /tmp/sem-ui.bmp
          python3 - /tmp/hud.bmp /tmp/sem-ui.bmp <<'PY'
          import struct, sys

          def ler(caminho):
              b = open(caminho, "rb").read()
              off = struct.unpack_from("<I", b, 10)[0]
              w, h = struct.unpack_from("<ii", b, 18)
              return b, off, w, h, (w * 3 + 3) // 4 * 4

          def pixels(caminho):
              b, off, w, h, row = ler(caminho)
              for y in range(h):
                  base = off + (h - 1 - y) * row
                  for x in range(w):
                      i = base + x * 3
                      yield (b[i + 2], b[i + 1], b[i])

          # COR_TEXTO, COR_DESTAQUE, COR_OURO — ver src/ui/mod.rs
          ALVOS = {(224, 235, 250): "texto", (115, 217, 255): "destaque", (255, 204, 64): "ouro"}
          achados = {}
          _, _, w, h, _ = ler("/tmp/hud.bmp")
          for cor in pixels("/tmp/hud.bmp"):
              for alvo, nome in ALVOS.items():
                  if sum(abs(cor[i] - alvo[i]) for i in range(3)) <= 6:
                      achados[nome] = achados.get(nome, 0) + 1
                      break
          for nome in ALVOS.values():
              assert nome in achados, f"o HUD nao desenhou {nome} (cores exatas das constantes)"
          print("cores do HUD na captura:", achados)

          # E a UI tem de mudar o quadro: capturas iguais significam que a
          # camada nova nao contribuiu um pixel.
          iguais = sum(1 for a, b in zip(pixels("/tmp/hud.bmp"), pixels("/tmp/sem-ui.bmp")) if a == b)
          total = w * h
          diferentes = total - iguais
          print(f"pixels diferentes com e sem UI: {diferentes} de {total}")
          assert diferentes > total * 0.02, "a UI ocupou menos de 2% do quadro"
          PY

      # Os modelos e as texturas sao arte em arquivo: o gerador garante que eles
      # sao reproduziveis, e o loader da engine tem de aceitar o que ele escreve.
      # Um OBJ que o tobj recusa passa pelo Node e falha no aparelho.
      - name: Modelos e texturas carregam
        working-directory: app/jogos/giochi-tower
        run: |
          set -e
          node scripts/gerar-modelos.mjs --conferir
          cargo test --locked --test modelos

      # O menu e a primeira tela do jogo. Aqui ele e aberto com teclas sinteticas
      # (o mesmo caminho do controle) e a captura e conferida por cor: painel,
      # destaque e selecao tem de aparecer.
      - name: O menu desenha e navega
        working-directory: app/jogos/giochi-tower
        run: |
          set -e
          SDL_VIDEODRIVER=offscreen cargo run --quiet -- --menu --tamanho 640x480 \
            --frames 5 --teclas "baixo,baixo,a,baixo" --quadro /tmp/menu.bmp 2>/tmp/menu.log
          grep -q "tela configuracoes | cursor 1 | Câmera" /tmp/menu.log
          python3 - /tmp/menu.bmp <<'PY'
          import struct, sys
          b = open(sys.argv[1], "rb").read()
          off = struct.unpack_from("<I", b, 10)[0]
          w, h = struct.unpack_from("<ii", b, 18)
          row = (w * 3 + 3) // 4 * 4
          cores = {}
          for y in range(h):
              base = off + (h - 1 - y) * row
              for x in range(w):
                  i = base + x * 3
                  cor = (b[i + 2], b[i + 1], b[i])
                  cores[cor] = cores.get(cor, 0) + 1
          # COR_DESTAQUE, COR_SELECAO, COR_APAGADO — ver src/ui/mod.rs
          for alvo, nome in [
              ((115, 217, 255), "destaque"),
              ((41, 71, 112), "selecao"),
              ((148, 163, 189), "apagado"),
          ]:
              achado = sum(n for c, n in cores.items() if sum(abs(a - bb) for a, bb in zip(c, alvo)) <= 6)
              assert achado > 50, f"o menu nao desenhou {nome} ({achado} px)"
          print("menu:", len(cores), "cores distintas")
          PY

      # O menu tem de **fazer** o que promete. Cada bloco abaixo cobre um caminho
      # que ja esteve quebrado: o `--teclas` chamava o menu direto e descartava a
      # acao, entao a tela mudava, o log dizia "tela partida" e a partida nao
      # comecava (0 passo de simulacao em 60 quadros).
      - name: O menu inicia, reinicia, sai e salva configuracao
        run: |
          set -ex
          export SDL_VIDEODRIVER=offscreen
          mkdir -p /tmp/towercfg
          cp config/*.ron /tmp/towercfg/
          BIN=target/release/giochi-tower

          # A = Jogar: 60 quadros depois tem de haver passo de simulacao.
          $BIN --menu --frames 60 --teclas "a" --config /tmp/towercfg 2>/tmp/a.log
          grep -q "partida: nova" /tmp/a.log
          grep -q "passo(s) de simulacao" /tmp/a.log

          # Start abre a pausa; baixo + A reinicia.
          $BIN --frames 90 --teclas "start,baixo,a" --config /tmp/towercfg 2>/tmp/b.log
          grep -q "partida: reiniciada" /tmp/b.log

          # cima + A sai do processo.
          $BIN --menu --frames 60 --teclas "cima,a" --config /tmp/towercfg 2>/tmp/c.log
          grep -q "sair pedido pelo menu" /tmp/c.log

          # Esquerda na linha Volume grava settings.json, e o valor persiste.
          rm -f /tmp/towercfg/settings.json
          $BIN --menu --frames 40 --teclas "baixo,baixo,a,esq,esq" --config /tmp/towercfg 2>/dev/null
          grep -q '"volume": 60' /tmp/towercfg/settings.json

      # Os `.ron` sao dado de balanceamento: um arquivo invalido tem de reprovar
      # no carregamento, nao na partida.
      - name: Config invalida reprova no carregamento
        working-directory: app/jogos/giochi-tower
        run: |
          set -e
          cp -r config /tmp/config-quebrado
          sed -i 's/hp_base: 5000.0/hp_base: -1.0/' /tmp/config-quebrado/tower.ron
          if SDL_VIDEODRIVER=offscreen cargo run --quiet -- \
               --config /tmp/config-quebrado --frames 1 2>/tmp/torre.log; then
            echo "config invalida tinha de reprovar"; exit 1
          fi
          grep -qi "torre\\|tower" /tmp/torre.log
          echo "reprovou, como esperado"
