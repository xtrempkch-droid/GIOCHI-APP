# Apps de PC (loja e forge): empacota e prova que roda em Windows, Linux e macOS.
#
# ## Por que uma matriz, se o `.pyz` é o mesmo arquivo nos três
#
# Porque o artefato ser o mesmo **não prova** que ele roda. `zipapp` é idêntico
# byte a byte em qualquer sistema; o que muda é o que o Python faz com ele —
# `pathlib` com `\` no Windows, `os.replace` entre volumes, CRLF no `print`,
# permissão de execução no macOS, caminho de fonte no `argparse`. Nada disso
# aparece num job que só roda `ubuntu-latest`.
#
# Então o desenho é: **um** pacote (determinístico, com SHA-256) e **três**
# execuções de verdade. É a mesma regra do resto do repositório: nada é
# declarado funcionando sem ter rodado.
name: PC apps

on:
  pull_request:
    paths:
      - "app/store/**"
      - "app/forge/**"
      # O painel arrasta forge e store para dentro do próprio `.pyz`: mexer
      # nele pode quebrar o empacotamento dos três. Deixá-lo fora daqui fez a
      # correção do 3.9 não rodar — o workflow existe justamente para isto.
      - "app/painel/**"
      - "scripts/empacotar-pc.mjs"
      - "scripts/lib/zip.mjs"
      - "scripts/testar-apps-pc.sh"
      - "tests/zip-pyz.test.mjs"
      - "tests/empacotar-pc.test.mjs"
      - "tests/consistencia-runtimes.test.mjs"
      - "tests/painel/**"
      - ".github/workflows/pc-apps.yml"
  push:
    branches: [main]
    paths:
      - "app/store/**"
      - "app/forge/**"
      - "app/painel/**"
      - "scripts/empacotar-pc.mjs"
      - "scripts/lib/zip.mjs"
      - "scripts/testar-apps-pc.sh"
      - "tests/painel/**"
      - ".github/workflows/pc-apps.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write # só o job de publicação anexa artefatos à release

jobs:
  # ── 0. os testes do próprio forge ──────────────────────────
  #
  # Vem antes de empacotar de propósito: um `.pyz` que abre e classifica errado
  # é pior que um pacote que não abre — o pacote quebrado aparece na hora, o
  # veredito errado aparece como jogo comprado que não roda.
  #
  # Os testes são os do antecessor `GIOCHI-KONSOL-OS` (`tests/forge/`) mais os
  # nossos, de 06/11/2026. Rodar em 3.9 também, porque o piso declarado é 3.9.
  testes:
    name: testes do forge (Python ${{ matrix.versao }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        versao: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.versao }}

      # Sem dependência de terceiro: é uma decisão do projeto, e aqui ela é
      # verificada — se um dia alguém adicionar um import externo, este passo
      # não instala nada e os testes falham no import.
      - name: Rodar os testes
        run: bash scripts/testar-apps-pc.sh

  # ── 1. o pacote ────────────────────────────────────────────
  # Um job só, de propósito: se cada sistema empacotasse, sairiam três
  # artefatos com hashes diferentes para o mesmo código, e o SHA-256 deixaria
  # de identificar o conteúdo.
  empacotar:
    name: empacotar .pyz
    needs: testes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Empacotar
        run: node scripts/empacotar-pc.mjs --saida dist/pc

      - name: Conferir determinismo
        # Empacotar duas vezes tem de dar o mesmo hash. Se não der, o
        # SHA256SUMS publicado mente sobre o conteúdo — e este é o único jeito
        # de descobrir isso sem comparar com uma execução anterior.
        run: |
          sha256sum dist/pc/*.pyz > /tmp/antes.txt
          node scripts/empacotar-pc.mjs --saida dist/pc > /dev/null
          sha256sum dist/pc/*.pyz > /tmp/depois.txt
          diff /tmp/antes.txt /tmp/depois.txt
          echo "reprodutível: mesmo sha256 nas duas rodadas"

      - name: Mostrar o que saiu
        run: |
          cat dist/pc/SHA256SUMS
          ls -la dist/pc

      - uses: actions/upload-artifact@v4
        with:
          name: pc-apps
          path: dist/pc/
          if-no-files-found: error

  # ── 2. provar que roda, em cada sistema ────────────────────
  executar:
    name: executar em ${{ matrix.rotulo }}
    needs: empacotar
    strategy:
      fail-fast: false # um sistema quebrado não deve esconder os outros dois
      matrix:
        include:
          - so: ubuntu-24.04
            rotulo: linux
            versao: "3.12"
          # O piso declarado na documentação. `from __future__ import
          # annotations` cobre `list[str]` e `str | None`, mas isso é raciocínio:
          # esta perna é a execução que prova.
          - so: ubuntu-24.04
            rotulo: linux-3.9 (piso)
            versao: "3.9"
          - so: windows-2022
            rotulo: windows
            versao: "3.12"
          # `macos-14` foi **aposentado em 02/11/2026** (actions/runner-images
          # #15226). Com o label morto o job não recebe runner e é cancelado em
          # 1 s, sem passo nenhum — o que parece "matriz cancelada" e não falta
          # de runner. `macos-15` é arm64, que é o Mac que o usuário tem hoje;
          # `macos-latest` já aponta para macOS 26 arm64.
          - so: macos-15
            rotulo: macos
            versao: "3.12"
    runs-on: ${{ matrix.so }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.versao }}

      - uses: actions/download-artifact@v4
        with:
          name: pc-apps
          path: dist/pc

      - name: Conferir o checksum publicado
        # O usuário vai fazer exatamente isto antes de rodar. Se falhar aqui,
        # falharia na mão dele.
        shell: bash
        run: |
          cd dist/pc
          if command -v sha256sum > /dev/null; then sha256sum -c SHA256SUMS; \
          else shasum -a 256 -c SHA256SUMS; fi

      - name: Versão do Python
        shell: bash
        run: python --version

      # `--help` prova que o zipimport resolveu todos os módulos. Um `.pyz` com
      # caminho errado morre aqui, e não na máquina do usuário.
      - name: Os três apps abrem
        shell: bash
        run: |
          python dist/pc/giochi-store.pyz --help > /dev/null
          python dist/pc/giochi-forge.pyz --help > /dev/null
          python dist/pc/giochi-forge.pyz --version
          # O painel arrasta o forge e o store para dentro do mesmo `.pyz`.
          # Se um dos três pacotes faltar no zip, o import falha aqui.
          python dist/pc/giochi-painel.pyz --versao

      # O painel é o único app com servidor: "o import resolveu" não prova que a
      # página é servida. Sem os estáticos dentro do `.pyz` ele abre e devolve
      # 404 na própria página — erro que só apareceria com o usuário na frente.
      - name: O painel serve a página e fala HTTP
        shell: bash
        run: |
          python dist/pc/giochi-painel.pyz --porta 8791 --sem-navegador &
          PID=$!
          # Até 20s esperando a porta: no Windows o primeiro `import` compila
          # bytecode e é visivelmente mais lento que no Linux.
          for i in $(seq 1 40); do
            if python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8791/', timeout=2)" 2>/dev/null; then
              break
            fi
            sleep 0.5
          done
          python - <<'FIM'
          import json, sys, urllib.error, urllib.request
          base = "http://127.0.0.1:8791"
          pagina = urllib.request.urlopen(base + "/", timeout=5).read().decode("utf-8")
          assert "Giochi" in pagina, "a página não é o painel"
          for nome in ("app.js", "estilo.css"):
              corpo = urllib.request.urlopen(base + "/" + nome, timeout=5).read()
              assert corpo, nome + " vazio"
          dados = json.load(urllib.request.urlopen(base + "/api/aparelhos", timeout=5))
          assert any(a["id"] == "x55" for a in dados["aparelhos"]), "sem perfil x55"
          try:
              urllib.request.urlopen(base + "/nao-existe.js", timeout=5)
              sys.exit("arquivo inexistente devolveu 200")
          except urllib.error.HTTPError as e:
              assert e.code == 404, e.code
          print("painel: página, estáticos e API respondem")
          FIM
          kill "$PID" || true

      # Exercita o que escreve em disco: `Path.mkdir`, `os.replace` e leitura de
      # arquivo. É aqui que Windows e macOS diferem de Linux de verdade.
      - name: Forge empacota um jogo de verdade
        shell: bash
        run: |
          mkdir -p saida
          python dist/pc/giochi-forge.pyz build \
            --project app/jogos/arcade-volleyball --out saida/av.giochi
          test -s saida/av.giochi

      - name: Store lê o pacote que o forge fez
        # Um app consome o outro: se as duas listas de `runtime` divergirem, esta
        # etapa acusa — foi assim que o defeito apareceu em 06/11/2026.
        shell: bash
        run: |
          mkdir -p catalogo
          cp saida/av.giochi catalogo/
          python dist/pc/giochi-store.pyz listar --src catalogo
          python dist/pc/giochi-store.pyz listar --src catalogo | grep -q "Arcade Volleyball"

      # Os perfis reais dos aparelhos, exercitados nos três sistemas. O
      # arcade-volleyball é `native` e tem de ser compatível no X55; o mesmo
      # projeto declarado como Godot tem de ser recusado, porque a imagem não
      # traz o runtime (medido — docs/godot.md).
      - name: Classifica contra o X55
        shell: bash
        # Pelo **código de saída**, não pelo texto. `check` já devolve
        # 0=compatível, 1=parcial, 2=incompatível — essa é a interface de
        # máquina. Comparar a saída com "Compatível" em UTF-8 quebrou o job de
        # Windows, onde o Python escrevia cp1252 e o acento virava outro byte
        # (corrigido na origem, mas o teste não deve depender disso).
        run: |
          python dist/pc/giochi-forge.pyz check --device x55 \
            --project app/jogos/arcade-volleyball
          echo "código de saída 0 = compatível"

      - name: E o jogo Godot tem de ser REPROVADO
        shell: bash
        # O outro lado da classificação. `check` devolve 2 para incompatível;
        # o `|| true` mantém o passo verde para que a asserção seja explícita —
        # se um dia voltar 0, o passo falha por não ter reprovado.
        run: |
          set +e
          python dist/pc/giochi-forge.pyz check --device x55 \
            --project app/jogos/spacewar > /tmp/godot.txt 2>&1
          codigo=$?
          cat /tmp/godot.txt
          if [ "$codigo" -eq 0 ]; then
            echo "spacewar tem de ser incompatível no X55 (não há runtime Godot na imagem)"
            exit 1
          fi
          echo "reprovado com código $codigo, como esperado"

      # O JSON do perfil, produzido pelo `.pyz` empacotado — não pela árvore de
      # origem. É o arquivo que o usuário recebe. A conferência é por `grep`
      # simples de propósito: um heredoc de Python dentro do YAML depende de
      # indentação e falha de um jeito difícil de ler.
      - name: Perfil do X55 tem o painel real, não o do SoC
        shell: bash
        run: |
          python dist/pc/giochi-forge.pyz profile --device x55 > /tmp/x55.json
          grep -A2 '"display"' /tmp/x55.json
          grep -q '"width": 720' /tmp/x55.json
          grep -q '"height": 1280' /tmp/x55.json
          grep -q '"ram_mb": 1968' /tmp/x55.json
          grep -q '"godot_runtime": false' /tmp/x55.json

      - name: Store gera o catálogo
        shell: bash
        run: |
          python dist/pc/giochi-store.pyz catalogo --src catalogo --out saida/cache
          test -s saida/cache/store.json
          cat saida/cache/store.json

      # O atalho só existe no Unix: no Windows o `.cmd` é testado no passo
      # seguinte, porque `cmd.exe` não executa script `sh`.
      - name: Atalho .sh funciona
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x dist/pc/giochi-forge.sh
          ./dist/pc/giochi-forge.sh --version

      - name: Atalho .cmd funciona
        if: runner.os == 'Windows'
        shell: cmd
        run: dist\pc\giochi-forge.cmd --version

      - name: Resumo
        shell: bash
        run: |
          echo "### ${{ matrix.rotulo }} — os dois apps executaram" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/pc/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── 3. anexar à release, quando houver tag ────────────────
  publicar:
    name: anexar à release
    needs: [empacotar, executar]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pc-apps
          path: dist/pc

      - name: Anexar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" dist/pc/* \
            --repo "${{ github.repository }}" --clobber
